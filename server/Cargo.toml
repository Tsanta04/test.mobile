[package]
name = "agricultural_monitoring_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.3.1"
actix-cors = "0.6.4"
diesel = { version = "2.1.0", features = ["postgres", "r2d2", "chrono"] }
dotenv = "0.15.0"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.97"
chrono = { version = "0.4.26", features = ["serde"] }
env_logger = "0.10.0"
log = "0.4.19"
r2d2 = "0.8.10"
jsonwebtoken = "8.3.0"
argon2 = "0.5.0"
futures = "0.3.28"
uuid = { version = "1.3.4", features = ["v4", "serde"] }

