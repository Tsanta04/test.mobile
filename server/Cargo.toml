[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.3.1"
actix-cors = "0.6.4"
diesel = { version = "2.1.0", features = ["postgres", "r2d2", "chrono"] }
dotenv = "0.15.0"
env_logger = "0.10.0"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
chrono = { version = "0.4.24", features = ["serde"] }
jsonwebtoken = "8.3.0"
argon2 = "0.5.0"
futures = "0.3.28"
log = "0.4.17"
r2d2 = "0.8.10"
uuid = { version = "1.3.3", features = ["v4", "serde"] }
thiserror = "1.0.40"

