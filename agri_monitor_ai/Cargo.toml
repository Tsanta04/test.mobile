[workspace]
members = [
    "crates/common",
    "crates/disease_detection",
    "api",
]
resolver = "2"

[workspace.dependencies]
# Common dependencies for all crates
tokio = { version = "1.35.1", features = ["full"] }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
actix-web = "4.4.1"
diesel = { version = "2.1.4", features = ["postgres", "r2d2", "chrono"] }
dotenv = "0.15.0"
chrono = { version = "0.4.31", features = ["serde"] }
ndarray = "0.15.6"
# tch = "0.14.0"  # PyTorch bindings for Rust - Commenté pour simplifier
linfa = "0.7.0"  # Machine learning framework
linfa-trees = "0.7.0"  # Random Forest implementation
# burn = "0.12.1"  # Deep learning framework - Commenté pour simplifier
mongodb = "2.8.0"
influxdb = "0.7.1"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
anyhow = "1.0.79"
thiserror = "1.0.56"
image = "0.24.8"
reqwest = { version = "0.11.23", features = ["json"] }
csv = "1.3.0"
rand = "0.8.5"
futures = "0.3.30"

